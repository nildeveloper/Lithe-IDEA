name: Build Lithe for macOS 12 (Monterey)

on:
  push:
    branches:
      - compat/macos-12
  workflow_dispatch:

concurrency:
  group: build-macos12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS 12 (arm64)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Bun for shared editor assets
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/editor/package.json

      - name: Build and package Lithe for macOS 12
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          LITHE_ARCH: "arm64"
        run: |
          ./scripts/package-app.sh
          ./scripts/create-dmg.sh
          dmg_file=$(ls dist/Lithe-*-arm64.dmg dist/Lithe-arm64.dmg dist/*.dmg 2>/dev/null | head -n 1)
          echo "Created DMG: $dmg_file"
          (cd dist && shasum -a 256 "$(basename "$dmg_file")" > "$(basename "$dmg_file").sha256")

      - name: Verify build artifacts
        run: |
          ls -la dist/
          app_path=$(ls -d dist/Lithe*.app 2>/dev/null | head -n 1)
          if [ -n "$app_path" ]; then
            echo "Inspecting $app_path"
            /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app_path/Contents/Info.plist" || true
            otool -l "$app_path/Contents/MacOS/Lithe" | grep -A 4 LC_BUILD_VERSION || otool -l "$app_path/Contents/MacOS/Lithe" | grep -A 4 LC_VERSION_MIN_MACOSX || true
          fi

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lithe-macos12-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
